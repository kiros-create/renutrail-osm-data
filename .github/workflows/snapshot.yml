name: OSM weekly snapshot

on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:
    inputs:
      operation:
        description: Build a candidate, or approve an already reviewed candidate
        type: choice
        options: [build, approve]
        default: build
      candidate_run_id:
        description: For approval only, successful build run ID from THIS repository
        type: string
        default: ''
      approved_snapshot_id:
        description: For approval only, exact reviewed osm-YYYYMMDD-12hex ID
        type: string
        default: ''

# No PR/push triggers, no user input interpolated as executable shell text.
# Site checkout, hosting credentials, accounts and Pages are never used here.
permissions:
  contents: read
  actions: read

concurrency:
  group: osm-snapshot-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.operation != 'approve'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_ready: ${{ steps.candidate.outputs.ready }}
    env:
      GH_REPO: ${{ github.repository }}
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned Python wheels
        run: python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements.txt
      - name: Test the pipeline and publication gate
        run: python -m unittest discover -s tests -v
      - name: Read latest published baseline (fail closed on API errors)
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python release.py previous --dir work/previous
      - name: Download current source
        id: source
        env:
          PREVIOUS: ${{ steps.baseline.outputs.path }}
        shell: bash
        run: |
          args=()
          if [ -n "$PREVIOUS" ]; then args+=(--previous "$PREVIOUS"); fi
          python pipeline.py download --pbf work/south-korea.osm.pbf "${args[@]}"
      - name: Build and validate candidate
        if: steps.source.outputs.unchanged != 'true' || github.event_name == 'workflow_dispatch'
        env:
          PREVIOUS: ${{ steps.baseline.outputs.path }}
        shell: bash
        run: |
          args=()
          if [ -n "$PREVIOUS" ]; then args+=(--previous "$PREVIOUS"); fi
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then args+=(--force); fi
          python pipeline.py build --pbf work/south-korea.osm.pbf --out dist/candidate "${args[@]}"
      - name: Candidate QA summary
        id: candidate
        if: github.event_name == 'workflow_dispatch' || steps.source.outputs.unchanged != 'true'
        shell: bash
        run: |
          python -c 'import json,os; m=json.load(open("dist/candidate/manifest.json")); open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("## Candidate " + m["snapshotId"] + "\n\n```json\n" + json.dumps({"counts":m["counts"],"quality":m["quality"]},ensure_ascii=False,indent=2) + "\n```\n")'
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
      - name: Save reviewable candidate (never raw PBF)
        if: steps.candidate.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osm-candidate
          path: dist/candidate/
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: build
    # Manual builds only create artifacts, even when automatic publishing is on.
    # Approval intentionally runs after the build job is skipped.
    if: >-
      always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'approve' && needs.build.result == 'skipped') ||
      (github.event_name == 'schedule' && vars.AUTO_PUBLISH == 'true' && needs.build.result == 'success' && needs.build.outputs.candidate_ready == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_REPO: ${{ github.repository }}
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
      APPROVED_SNAPSHOT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'approve' && inputs.approved_snapshot_id || '' }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || '' }}
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Fresh checkout; no build environment, native parser, or pip dependencies.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Restore current scheduled candidate
        if: github.event_name == 'schedule'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: osm-candidate
          path: dist/candidate
      - name: Restore exact reviewed candidate
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'approve'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python release.py candidate --run-id "$CANDIDATE_RUN_ID" --dir dist/candidate
      - name: Read latest published baseline (fail closed on API errors)
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python release.py previous --dir work/previous
      - name: Publish only with quality PASS and valid human/automatic gate
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.baseline.outputs.path }}
        shell: bash
        run: |
          args=()
          if [ -n "$PREVIOUS" ]; then args+=(--previous "$PREVIOUS"); fi
          python release.py publish --dir dist/candidate "${args[@]}"
